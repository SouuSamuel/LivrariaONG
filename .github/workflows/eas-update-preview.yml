name: EAS Update Preview

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: eas-update-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-preview:
    name: Publish preview update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update to preview
        run: eas update --channel preview --environment preview --message "GitHub commit ${{ github.sha }}" --non-interactive
